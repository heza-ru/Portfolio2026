    <!-- DNS prefetch for external font origins -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://api.fontshare.com">

    <!-- Early connections to font origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>

    <!-- Hero 3D — start download early (meshopt-compressed GLB) -->
    <link rel="preload" href="/HeroModel4.glb" as="fetch" crossorigin="anonymous" />

    <!--
      Load only the weights we actually use.
      Instrument Serif, IBM Plex Mono, Cormorant Garamond (drama / Philosophy)
    -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=IBM+Plex+Mono:ital,wght@0,400;1,400&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet">

    <!-- Fontshare: Clash Display (headers) + Satoshi (body) -->
    <link
        href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap"
        rel="stylesheet">
